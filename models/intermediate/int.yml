version: 2

models:

  - name: int_station_infoclimat
    description: Combines Infoclimat hourly weather observations with weather station metadata.

    columns:
      - name: station_id
        description: "Weather station identifier."
        tests:
          - not_null

      - name: observed_at
        description: "UTC timestamp of the observation."
        tests:
          - not_null

  - name: int_weather_underground_joined
    description: Combines Weather Underground observations from France and Belgium.

    columns:
      - name: observed_at
        description: "Timestamp of the observation."
        tests:
          - not_null